name: Build and Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.1)'
        required: true

env:
  SCHEME: VoiceClaudePoC
  PRODUCT_NAME: CCTalk
  PROJECT: VoiceClaudePoC.xcodeproj

jobs:
  build-and-release:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Inject feedback token
        env:
          CCTALK_FEEDBACK_TOKEN: ${{ secrets.CCTALK_FEEDBACK_TOKEN }}
        run: |
          # Replace placeholder with actual token
          sed -i '' "s/__FEEDBACK_TOKEN_PLACEHOLDER__/${CCTALK_FEEDBACK_TOKEN}/g" \
            VoiceClaudePoC/Features/Feedback/FeedbackService.swift

          # Verify replacement (without exposing token)
          if grep -q "__FEEDBACK_TOKEN_PLACEHOLDER__" VoiceClaudePoC/Features/Feedback/FeedbackService.swift; then
            echo "ERROR: Token placeholder was not replaced!"
            exit 1
          fi
          echo "Feedback token injected successfully"

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          rm certificate.p12

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Build archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath $RUNNER_TEMP/CCTalk.xcarchive \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            ONLY_ACTIVE_ARCH=NO

      - name: Export app
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>${{ secrets.DEVELOPMENT_TEAM }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/CCTalk.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/Export

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cd $RUNNER_TEMP/Export
          ditto -c -k --keepParent "$PRODUCT_NAME.app" "$PRODUCT_NAME-notarize.zip"

          xcrun notarytool submit "$PRODUCT_NAME-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$PRODUCT_NAME.app"
          rm "$PRODUCT_NAME-notarize.zip"

      - name: Create DMG
        run: |
          cd $RUNNER_TEMP/Export
          hdiutil create -volname "$PRODUCT_NAME" \
            -srcfolder "$PRODUCT_NAME.app" \
            -ov -format UDZO \
            "$PRODUCT_NAME.dmg"

      - name: Sign DMG with Sparkle EdDSA key
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          cd $RUNNER_TEMP/Export

          curl -L "https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz" -o sparkle.tar.xz
          tar -xf sparkle.tar.xz

          echo "$SPARKLE_EDDSA_PRIVATE_KEY" > eddsa_private.key
          EDDSA_SIGNATURE=$(./bin/sign_update "$PRODUCT_NAME.dmg" --ed-key-file eddsa_private.key)
          echo "EDDSA_SIGNATURE=$EDDSA_SIGNATURE" >> $GITHUB_ENV

          FILE_SIZE=$(stat -f%z "$PRODUCT_NAME.dmg")
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV

          RELEASE_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S %z")
          echo "RELEASE_DATE=$RELEASE_DATE" >> $GITHUB_ENV

          rm eddsa_private.key sparkle.tar.xz
          rm -rf bin Sparkle.framework

      - name: Generate appcast.xml
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD=${{ github.run_number }}

          cat > $RUNNER_TEMP/Export/appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>CCTalk Updates</title>
              <link>https://github.com/${{ github.repository }}/releases</link>
              <description>Most recent changes with links to updates.</description>
              <language>en</language>
              <item>
                <title>Version $VERSION</title>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <pubDate>${RELEASE_DATE}</pubDate>
                <enclosure
                  url="https://github.com/${{ github.repository }}/releases/download/v$VERSION/CCTalk.dmg"
                  ${EDDSA_SIGNATURE}
                  type="application/octet-stream"
                />
              </item>
            </channel>
          </rss>
          EOF

          echo "Generated appcast.xml:"
          cat $RUNNER_TEMP/Export/appcast.xml

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CCTalk v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            ${{ runner.temp }}/Export/CCTalk.dmg
            ${{ runner.temp }}/Export/appcast.xml
          body: |
            ## CCTalk v${{ steps.version.outputs.version }}

            Voice-to-text for Claude Code CLI.

            Download `CCTalk.dmg` to install or update.

            Built from commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
